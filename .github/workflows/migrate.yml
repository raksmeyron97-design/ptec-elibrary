# Database migration pipeline (see supabase/MIGRATIONS.md).
#
# - PRs touching supabase/migrations/**: dry-run against the hosted DB and
#   report what WOULD be applied (the e2e job separately proves the chain
#   applies cleanly from scratch on a local stack).
# - Push to main touching supabase/migrations/**: apply pending migrations
#   for real via `supabase db push`.
#
# Requires the SUPABASE_DB_URL secret: the **Session pooler** connection
# string (aws-*.pooler.supabase.com:5432) — NOT the direct db.<ref> host
# (IPv6-only, unreachable from GitHub runners) and NOT the transaction
# pooler on 6543 (breaks prepared statements / advisory locks).
#
# SELF-HOSTED MODE (docs/SELF_HOSTED_SUPABASE_CUTOVER.md): the self-hosted
# Postgres publishes no port, so nothing on GitHub can reach it. Once the
# secret is REMOVED at cutover this workflow reports that migrations are
# applied on the box by infra/supabase/scripts/migrate.sh (invoked by
# deploy/deploy.sh before every image roll) and exits green — it does not
# fail, and it does not try. The e2e job in ci.yml keeps proving on every PR
# that the chain applies cleanly from the baseline.
#
# First run bootstraps supabase_migrations.schema_migrations from
# supabase/applied-baseline-2026-07-16.txt (every version in that manifest
# was verified applied on the hosted DB on 2026-07-16 via object probes);
# it is a no-op once the history table has rows.
name: Migrate Database

on:
  push:
    branches: [ "main" ]
    paths: [ "supabase/migrations/**" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "supabase/migrations/**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-hosted-db
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Detect mode
        id: mode
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "mode=self-hosted" >> "$GITHUB_OUTPUT"
            {
              echo "### Self-hosted Supabase mode"
              echo
              echo "No \`SUPABASE_DB_URL\` secret: the database is self-hosted and publishes no"
              echo "port. Migrations under \`supabase/migrations/\` are applied on the ZimaOS box by"
              echo "\`infra/supabase/scripts/migrate.sh\`, which \`deploy/deploy.sh\` runs before it"
              echo "rolls a new image forward. Nothing was applied from this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=cloud" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.mode.outputs.mode == 'cloud'
        with:
          node-version: 22

      - name: Bootstrap migration history (no-op after first run)
        if: steps.mode.outputs.mode == 'cloud'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          npm i --no-save --no-audit --no-fund pg
          node scripts/migrations/bootstrap-history.mjs

      - uses: supabase/setup-cli@v1
        if: steps.mode.outputs.mode == 'cloud'
        with:
          version: latest

      - name: Dry run (PR)
        if: steps.mode.outputs.mode == 'cloud' && github.event_name == 'pull_request'
        run: supabase db push --dry-run --include-all --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Apply migrations (main)
        if: steps.mode.outputs.mode == 'cloud' && github.event_name != 'pull_request'
        run: echo Y | supabase db push --include-all --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Show final history
        if: steps.mode.outputs.mode == 'cloud'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase migration list --db-url "$SUPABASE_DB_URL" | tail -15

      - name: Checkout alert action
        if: failure() && github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/telegram-alert
          sparse-checkout-cone-mode: false

      # Sev 2, not 1: a failed migration leaves the schema mid-flight, which
      # can break writes for a whole content type, but the site is still up.
      - name: Telegram alert (Sev 2 — migration failed)
        if: failure() && github.event_name != 'pull_request'
        uses: ./.github/actions/telegram-alert
        with:
          severity: "2"
          title: Database migration failed on main
          service: supabase-migrate
          message: >-
            The hosted database may be mid-migration. Check the run log before
            deploying anything else; never fix it by hand in the SQL editor.
          runbook: docs/RUNBOOKS.md §I16
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
