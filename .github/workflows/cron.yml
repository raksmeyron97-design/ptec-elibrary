# Scheduled jobs for the self-hosted deployment.
#
# These used to be Vercel Cron entries in vercel.json. The app now runs as a
# Docker container on ZimaOS, where nothing schedules anything — so without
# this workflow `scheduled` posts/theses/books/paths never flip to
# `published`, the rate_limit table grows forever, and no security detection
# pass ever runs.
#
# The routes themselves are platform-neutral: plain GETs guarded by
# `Authorization: Bearer $CRON_SECRET`, which any scheduler can send.
#
# GitHub Actions is the scheduler of record because it is the one component
# that keeps working when the college's network or the box itself is down —
# a failed run emails the repo owner, which is the alert. The alternative
# (a cron container in docker-compose.yml) is documented in
# docs/ZIMAOS-DEPLOYMENT.md for sites that would rather not depend on GitHub;
# run one OR the other, not both — the sweeps are idempotent, but two
# schedulers means two sets of logs to reconcile during an incident.
#
# Required repo secret: CRON_SECRET — the SAME value as in the box's .env.
# Rotating it means changing both, in the same maintenance window.
name: Scheduled Jobs

on:
  schedule:
    # Security detection pass every 5 minutes — the finest granularity GitHub
    # offers, and the interval that decides how quickly an attack in progress
    # becomes an incident somebody is told about. The pass is idempotent and
    # cheap (one indexed range scan); overlapping runs cannot double-open an
    # incident or double-notify (see the route's header and migration 0127).
    - cron: "*/5 * * * *"
    # Publish sweep every 15 minutes: the finest granularity an editor can
    # meaningfully schedule to, and cheap (four small UPDATEs).
    - cron: "3/15 * * * *"
    # Retention cleanup once a day at 20:00 UTC = 03:00 Asia/Phnom_Penh.
    - cron: "0 20 * * *"
    # Upload reconciliation hourly. Hourly rather than daily because the state
    # it repairs — a session stuck in FINALIZING — makes an operator's retry
    # fail with "already being finalized" until it is released, and a librarian
    # blocked on one book will not wait until 03:00.
    - cron: "17 * * * *"
    # Index reconciliation hourly, offset from the upload sweep so the two do
    # not contend for the box. Hourly rather than daily because the backlog it
    # drains is invisible to readers in the worst way: a book that is published
    # and listed but whose text nothing can search, and whose pages no AI
    # answer can cite. The pass is bounded (10 records) and claims what it
    # works on, so overlapping runs cannot double-process a record.
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Which sweep to run
        required: true
        default: publish-scheduled
        type: choice
        options: [publish-scheduled, cleanup, security-scan, upload-reconcile, index-reconcile, both]

permissions:
  contents: read # checkout, on the runs that alert

env:
  SITE_URL: https://library.ptec.edu.kh

jobs:
  # ── Security detection + incident + notification pass ──────────────────────
  # Deliberately the first job in this file: it is the one whose lateness has
  # security consequences.
  security-scan:
    if: >-
      github.event.schedule == '*/5 * * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'security-scan')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run detection pass
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error title=CRON_SECRET missing::Set the CRON_SECRET repo secret to the same value as the box's .env"
            exit 1
          fi
          # ONE attempt, unlike the other sweeps. A retry here would re-run a
          # pass that may already have sent notifications; the next tick is
          # five minutes away, and the pass is designed to catch up.
          code=$(curl -sS --max-time 120 -o /tmp/scan.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/security-scan")
          cat /tmp/scan.json 2>/dev/null; echo
          [ "$code" = "200" ] && exit 0
          echo "::error title=Security scan failed::/api/cron/security-scan returned ${code:-no-response} — detection is not running"
          exit 1

      - name: Checkout (alerting runs only)
        if: failure()
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/telegram-alert
          sparse-checkout-cone-mode: false

      # Sev 2, not 3: while this fails, security events are still being
      # recorded but nothing is being detected or announced. The library is not
      # down — the monitoring is.
      - name: Telegram alert (Sev 2)
        if: failure()
        uses: ./.github/actions/telegram-alert
        with:
          severity: "2"
          title: Security detection pass failing
          service: /api/cron/security-scan
          message: >-
            Events are still being recorded, but no detection, incident or
            notification is running. Security alerting is blind until this
            recovers.
          runbook: docs/SECURITY-MONITORING.md
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}

  publish-scheduled:
    # Skip on the security and cleanup ticks; run on the 15-minute tick and on
    # a manual dispatch that asked for it.
    if: >-
      github.event.schedule == '3/15 * * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.job == 'publish-scheduled' || inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Flip scheduled content to published
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error title=CRON_SECRET missing::Set the CRON_SECRET repo secret to the same value as the box's .env"
            exit 1
          fi
          # Two attempts: a single cold start or tunnel blip must not page.
          for attempt in 1 2; do
            code=$(curl -sS --max-time 60 -o /tmp/body.json -w '%{http_code}' \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$SITE_URL/api/cron/publish-scheduled") && [ "$code" = "200" ] && {
                cat /tmp/body.json; echo; exit 0; }
            echo "attempt $attempt: HTTP ${code:-no-response}"
            cat /tmp/body.json 2>/dev/null || true
            [ "$attempt" -lt 2 ] && sleep 20
          done
          echo "::error title=Publish sweep failed::/api/cron/publish-scheduled did not return 200 — see docs/RUNBOOKS.md"
          exit 1

      - name: Checkout (alerting runs only)
        if: failure()
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/telegram-alert
          sparse-checkout-cone-mode: false

      - name: Telegram alert (Sev 2)
        if: failure()
        uses: ./.github/actions/telegram-alert
        with:
          severity: "2"
          title: Publish sweep failed
          service: /api/cron/publish-scheduled
          message: Scheduled content is not flipping to published.
          runbook: docs/RUNBOOKS.md §M2
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}

  cleanup:
    if: >-
      github.event.schedule == '0 20 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.job == 'cleanup' || inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Purge stale rows (rate limits, analytics, security retention)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error title=CRON_SECRET missing::Set the CRON_SECRET repo secret to the same value as the box's .env"
            exit 1
          fi
          for attempt in 1 2; do
            code=$(curl -sS --max-time 60 -o /tmp/body.json -w '%{http_code}' \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$SITE_URL/api/cron/cleanup") && [ "$code" = "200" ] && {
                cat /tmp/body.json; echo; exit 0; }
            echo "attempt $attempt: HTTP ${code:-no-response}"
            cat /tmp/body.json 2>/dev/null || true
            [ "$attempt" -lt 2 ] && sleep 20
          done
          echo "::error title=Cleanup sweep failed::/api/cron/cleanup did not return 200 — see docs/RUNBOOKS.md"
          exit 1

      - name: Checkout (alerting runs only)
        if: failure()
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/telegram-alert
          sparse-checkout-cone-mode: false

      - name: Telegram alert (Sev 2)
        if: failure()
        uses: ./.github/actions/telegram-alert
        with:
          severity: "2"
          title: Cleanup sweep failed
          service: /api/cron/cleanup
          message: >-
            Retention deletes are not running; rate_limit and security_events
            will grow without bound.
          runbook: docs/RUNBOOKS.md §M2
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}

  # ── Upload session reconciliation ───────────────────────────────────────────
  # Releases sessions whose request died mid-transition, adopts files whose row
  # exists but whose session never heard, flags files no record references, and
  # reclaims staging disk. Reports only: `purge` is NOT passed on the schedule,
  # so nothing in storage is deleted by a timer. See lib/uploads/reconcile.ts.
  #
  # NO TELEGRAM ALERT, unlike the three jobs above, and deliberately. Nothing
  # here is time-critical: a missed pass leaves a stuck session stuck for
  # another hour and some staging disk unreclaimed, neither of which is worth
  # waking anyone. The failed run still emails the repo owner. If this job
  # starts failing persistently the symptom an operator will actually notice is
  # an upload that answers "already being finalized" — docs/CHUNKED-UPLOAD.md §8.
  upload-reconcile:
    if: >-
      github.event.schedule == '17 * * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.job == 'upload-reconcile' || inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile upload sessions
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error title=CRON_SECRET missing::Set the CRON_SECRET repo secret to the same value as the box's .env"
            exit 1
          fi
          for attempt in 1 2; do
            code=$(curl -sS --max-time 90 -o /tmp/body.json -w '%{http_code}' \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$SITE_URL/api/cron/upload-reconcile") && [ "$code" = "200" ] && {
                cat /tmp/body.json; echo; exit 0; }
            echo "attempt $attempt: HTTP ${code:-no-response}"
            cat /tmp/body.json 2>/dev/null || true
            [ "$attempt" -lt 2 ] && sleep 20
          done
          echo "::error title=Upload reconciliation failed::/api/cron/upload-reconcile did not return 200 — see docs/RUNBOOKS.md"
          exit 1

  # ── Retrieval index reconciliation ──────────────────────────────────────────
  # Re-runs PDF text extraction for resources that need it: never attempted, a
  # retry now due, indexed from a PDF that has since been replaced, or holding
  # a claim left behind by a killed runner. Bounded per pass; see
  # lib/indexing/reconcile.ts for what is eligible and why.
  #
  # NO TELEGRAM ALERT, same reasoning as upload-reconcile: a missed pass delays
  # a book becoming full-text searchable by an hour, which is not worth waking
  # anyone. The failure that DOES matter here is silent success — a pass that
  # returns 200 having refused to do anything because this deployment's storage
  # allow-list cannot reach its own files. That is why the step below inspects
  # `skippedEnvironment` in the body and fails loudly on it: an environment
  # mismatch is exactly the condition that once wrote 203 false verdicts, and a
  # green tick over it would repeat the original mistake one layer up.
  index-reconcile:
    if: >-
      github.event.schedule == '41 * * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.job == 'index-reconcile' || inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconcile retrieval index
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error title=CRON_SECRET missing::Set the CRON_SECRET repo secret to the same value as the box's .env"
            exit 1
          fi
          for attempt in 1 2; do
            code=$(curl -sS --max-time 300 -o /tmp/body.json -w '%{http_code}' \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$SITE_URL/api/cron/index-reconcile") && [ "$code" = "200" ] && {
                cat /tmp/body.json; echo
                if grep -q '"skippedEnvironment":true' /tmp/body.json; then
                  echo "::error title=Index reconciliation refused to run::The deployment's storage allow-list cannot reach the files in its own database (ZIMA_API_URL vs book_files hosts) — see docs/INDEX-RECONCILIATION.md"
                  exit 1
                fi
                exit 0; }
            echo "attempt $attempt: HTTP ${code:-no-response}"
            cat /tmp/body.json 2>/dev/null || true
            [ "$attempt" -lt 2 ] && sleep 20
          done
          echo "::error title=Index reconciliation failed::/api/cron/index-reconcile did not return 200 — see docs/RUNBOOKS.md"
          exit 1
