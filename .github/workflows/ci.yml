name: CI

on:
  # No `push: main` trigger. Pushes to main run through docker-publish.yml,
  # which calls this workflow first — a push trigger here would duplicate the
  # whole suite on every merge and fight it for the concurrency slot.
  pull_request:
    branches: [ "main" ]
  # Lets docker-publish.yml gate the image build on the full suite.
  workflow_call:

# A newer push to the same branch/PR supersedes the running CI — cancel it
# instead of letting both bill Actions minutes (Playwright runs are the
# expensive part). main pushes are never cancelled mid-run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Scan the full git history for committed secrets on every push.
  # If this ever fires on a real secret: rotate it first, then clean history.
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # On pull_request events gitleaks-action lists the PR's commits via the
      # API; without this the job 403s ("Resource not accessible by
      # integration") before scanning anything.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A committed secret is the catalog's `secret-in-history` — Sev 1, the
      # only CI failure that pages. Everything else in CI is a build problem.
      # Runs on the default branch only: a contributor's PR that trips
      # gitleaks is caught by the failing check, and paging on every PR would
      # train the responder to ignore the channel.
      - name: Telegram alert (Sev 1 — secret detected)
        if: failure() && github.ref == 'refs/heads/main'
        uses: ./.github/actions/telegram-alert
        with:
          severity: "1"
          title: Secret detected in the repository
          service: gitleaks
          message: >-
            A commit on main matched a secret pattern. ROTATE THE CREDENTIAL
            FIRST, then rewrite history. The value is not repeated here.
          runbook: docs/RUNBOOKS.md §I10
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}

  # On PRs, block newly-introduced dependencies with known vulnerabilities.
  # Requires the dependency graph — free on public repos, GHAS-only on
  # private ones (it failed every PR while this repo was private).

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # The toolchain (vitest 4 / rolldown, vite 8, pdfjs-dist, oxlint) requires
        # Node >=20; Node 18 lacks node:util's styleText and crashes vitest.
        node-version: 22
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    # Fail on high/critical advisories in production dependencies only —
    # dev-tooling advisories are noise and moderate ones are tracked manually
    # (see docs/SECURITY-OPS.md §6).
    #
    # The gate fails on advisories that can actually be fixed and warns (without
    # blocking) on those whose only remedy is a semver-major bump of a framework
    # dependency. A bare `npm audit --audit-level=high` blocked every PR in the
    # repo on 2026-07-22 over `sharp` CVEs reachable only through `next`, where
    # npm's proposed fix was Next 16 → 9.3.3. See scripts/audit-gate.mjs.
    - name: Audit production dependencies
      run: node scripts/audit-gate.mjs

    # /hero/* ships with a 1-year immutable Cache-Control header — fail fast
    # if public/ptec-library.jpg changed without regenerating the variants
    # (see scripts/optimize-hero.mjs for the maintenance rule).
    - name: Hero image cache safety
      run: npm run check:hero

    - name: Type Check
      # tsc needs > the ~2GB default heap on this codebase; the runner has 7GB.
      # Verified locally: passes cleanly at 4GB (OOM'd CI at default).
      env:
        NODE_OPTIONS: --max-old-space-size=4096
      run: npx tsc --noEmit
      
    - name: Lint
      run: npm run lint
      
    - name: Unit Tests
      run: npx vitest run

    # Build integrity on the default branch. Sev 3: main is broken, which is a
    # next-working-day problem, not a 03:00 one — nothing is down.
    - name: Telegram alert (Sev 3 — CI failed on main)
      if: failure() && github.ref == 'refs/heads/main'
      uses: ./.github/actions/telegram-alert
      with:
        severity: "3"
        title: CI failed on main
        service: ci
        message: >-
          Type check, lint, audit or unit tests failed on the default branch.
          Deployments from this commit should not be trusted.
        runbook: docs/RUNBOOKS.md §I15
        bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}

  # Playwright suite against a REAL database: a local Supabase stack is
  # booted in the runner, the full migration chain is applied from the
  # squashed baseline (which doubles as a fresh-apply test of every new
  # migration), and supabase/seed.sql provides the published content the
  # public pages need. No hosted credentials are involved.
  e2e:
    runs-on: ubuntu-latest
    # A backstop for a HUNG run, not a budget for a slow one. 45 was set in
    # July for a suite a fraction of today's 690 tests; by 2026-09-28 the ten
    # most recent green runs took 36:51–44:04 of it, and #270 (four new tests)
    # was cut off ~20 s from the end of a run that had not failed anything.
    # This job also gates docker-publish.yml, so a timeout here blocks a deploy.
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Pinned, and authenticated. `version: latest` made every e2e run depend on
    # an unauthenticated GitHub API call to resolve the newest release, which
    # is rate limited per runner IP — it failed with "Failed to resolve latest
    # Supabase CLI release: rate limit exceeded" and killed the job 25 s in,
    # before a single test ran. An exact version needs no resolution at all,
    # and it also keeps a CLI release from changing what CI does overnight.
    # github-token authenticates whatever calls remain (the action documents
    # this input for exactly this failure).
    - uses: supabase/setup-cli@v1
      with:
        version: 2.116.0
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Start local Supabase (applies migrations + seed)
      run: supabase start -x studio,imgproxy,logflare,vector

    - name: Export local Supabase credentials
      run: |
        eval "$(supabase status -o env)"
        {
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          # No Gemini key exists in CI. The assistant runs against the
          # deterministic stand-in model so its surfaces are testable at all;
          # see lib/ai/mock-model.ts.
          echo "AI_MOCK_PROVIDER=1"
          echo "AI_DAILY_USER_LIMIT=500"
          echo "AI_COOLDOWN_MS=0"
        } >> "$GITHUB_ENV"

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run E2E Tests
      run: npx playwright test

    - name: Upload Playwright report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7

  # The SEO invariants (scripts/seo-check.ts, docs/seo/) on a PRODUCTION build
  # of this commit, against the seeded local Supabase — the exact shape every
  # phase of the SEO programme exited on (D13). Production itself is never the
  # target here: it 502s under light concurrency, and a PR must be judged on
  # its own code.
  #
  # NON-GATING until its first green run on GitHub. The URL list
  # (scripts/seo-urls.local.json) names only records supabase/seed.sql
  # creates, but it was exercised on a developer database holding the seed
  # plus more, never on a fresh seed. Once this job has passed here, set
  # `continue-on-error: false` and add it to the branch protection checks.
  seo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - uses: supabase/setup-cli@v1
      with:
        version: 2.116.0
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Start local Supabase (applies migrations + seed)
      run: supabase start -x studio,imgproxy,logflare,vector

    # SEO_INDEXING=on at BUILD time as well as at start: it decides the
    # sitemap and robots output that gets prerendered, and it makes SITE_URL
    # resolve to the production origin (a loopback site URL is refused in an
    # indexable environment), which is what the canonical checks compare to.
    - name: Export local Supabase credentials
      run: |
        eval "$(supabase status -o env)"
        {
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          echo "SEO_INDEXING=on"
          echo "AI_MOCK_PROVIDER=1"
        } >> "$GITHUB_ENV"

    - name: Production build
      run: npm run build
      env:
        NODE_OPTIONS: --max-old-space-size=4096

    - name: Start the production server
      run: |
        npx next start -p 3000 > next-start.log 2>&1 &
        for i in $(seq 1 60); do
          curl -sf -o /dev/null http://localhost:3000/robots.txt && exit 0
          sleep 2
        done
        echo "server did not come up"; cat next-start.log; exit 1

    - name: seo-check (every phase)
      run: |
        mkdir -p reports
        npx tsx scripts/seo-check.ts --base http://localhost:3000 \
          --urls scripts/seo-urls.local.json --delay 50 --json reports/seo-check.json

    - name: Upload the seo-check report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: seo-check
        path: |
          reports/seo-check.json
          next-start.log
        retention-days: 14
