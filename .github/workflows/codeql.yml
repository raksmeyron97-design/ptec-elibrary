# Static code scanning (CodeQL) — Phase 30/31 of the defense-in-depth plan.
#
# Threat: a vulnerable code pattern (injection sink, unsafe deserialization,
# tainted flow into a sensitive API) merges without any static analysis pass.
# Enforcement point: CI on PRs + main + a weekly sweep so newly added CodeQL
# queries retroactively cover existing code.
# Failure mode: findings surface in the repo's Security tab / PR checks; the
# workflow itself never blocks deploys on informational findings — triage
# happens through code-scanning alerts, not a hard CI gate (see
# docs/SECURITY_DEFENSE_IN_DEPTH.md → CI security gates).
#
# security-events: write is required to upload SARIF results; everything else
# stays read-only, matching the repo's minimal-permissions convention.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 2 * * 1" # Mondays 02:23 UTC — off the busy on-the-hour slots

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      # Required by github/codeql-action on private repos; harmless on public.
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-extended adds queries with lower confidence; start with
          # the default suite to keep alerts high-signal, widen deliberately.
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

      - name: Checkout alert action
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/telegram-alert
          sparse-checkout-cone-mode: false

      # The ANALYSIS failing is what this alerts on — findings themselves go to
      # the GitHub Security tab, which is where they are triaged. Sev 3: static
      # analysis stopping is a next-working-day problem.
      - name: Telegram alert (Sev 3 — CodeQL failed)
        if: failure() && github.ref == 'refs/heads/main'
        uses: ./.github/actions/telegram-alert
        with:
          severity: "3"
          title: CodeQL analysis failed
          service: codeql
          message: >-
            Static analysis did not complete on main, so new code is not being
            scanned. Findings (when it runs) live in the GitHub Security tab.
          runbook: docs/RUNBOOKS.md §M5
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
