name: Scheduled File Health Check

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allows you to trigger it manually from the Actions tab

jobs:
  check-file-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Run File Health Check
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Zima meters /files reads per IP: 300/min anonymous, 3000/min with a
          # recognised key. A sweep is ~540 requests, so without these the run
          # is rate limited from request ~300 on (those rows are recorded as
          # `unknown`, not `broken`, and the job exits 2 to say so).
          ZIMA_API_URL: ${{ secrets.ZIMA_API_URL }}
          ZIMA_API_KEY: ${{ secrets.ZIMA_API_KEY }}
          # Uncomment and configure these if you still have legacy bare-key file_urls in R2
          # R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          # R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          # R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: npx tsx scripts/check-file-health.ts
