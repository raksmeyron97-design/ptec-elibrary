# Staging/validation override: catch every auth email in Mailpit instead of
# sending through Gmail, so the shape of confirmation/recovery links can be
# inspected (README §Staging). Never used in production.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   open http://127.0.0.1:8025
services:
  mailpit:
    image: axllent/mailpit:v1.28
    container_name: supabase-mailpit
    restart: unless-stopped
    networks: [supabase]
    ports:
      - "127.0.0.1:8025:8025"
  auth:
    environment:
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
      GOTRUE_SMTP_ADMIN_EMAIL: dev@ptec.local
