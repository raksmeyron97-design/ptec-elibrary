# Local build override — use when developing on a machine, or to build on the
# ZimaOS box itself if GHCR is unreachable.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Normal deploys do NOT use this file; they pull the CI-built image.
#
# The NEXT_PUBLIC_* args below are inlined into the client bundle at build
# time and must be present in .env, or the browser gets an undefined Supabase
# URL. In CI the same values come from repository variables — see
# .github/workflows/docker-publish.yml.
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
        NEXT_PUBLIC_R2_PUBLIC_URL: ${NEXT_PUBLIC_R2_PUBLIC_URL}
        NEXT_PUBLIC_R2_COVERS_URL: ${NEXT_PUBLIC_R2_COVERS_URL}
      # Prerendering reads the service-role-only site_settings table, so the
      # build needs this key. It is a BuildKit secret rather than a build arg:
      # it bypasses RLS, and ARG values survive in `docker history`.
      secrets:
        - supabase_service_role_key
    image: ptec-elibrary:local

secrets:
  supabase_service_role_key:
    environment: SUPABASE_SERVICE_ROLE_KEY
