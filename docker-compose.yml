# PTEC e-Library — ZimaOS deployment.
#
# The box does NOT build. It pulls the image CI published to GHCR:
#
#   docker compose up -d                     # app only (LAN-reachable, for stages 1-2)
#   docker compose --profile tunnel up -d    # app + Cloudflare Tunnel (production)
#
# Pin or roll back a version by setting IMAGE_TAG in .env:
#   IMAGE_TAG=main            (default — whatever CI last published from main)
#   IMAGE_TAG=sha-<40-char>   pin to one commit
#   IMAGE_TAG=v1.2.3          pin to a release tag
#
# To build locally instead of pulling, add the override file:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# With the tunnel profile the app publishes NO host port at all: the only way
# in is Cloudflare → cloudflared → private Docker network → app. The origin
# stays invisible to the public internet. See docs/ZIMAOS-DEPLOYMENT.md.
#
# Runtime secrets come from .env (never baked into the image). The
# NEXT_PUBLIC_* values are compiled into the client bundle by CI and are
# public by definition — everything else stays server-side.

services:
  app:
    image: ghcr.io/raksmeyron97-design/ptec-elibrary:${IMAGE_TAG:-main}
    container_name: ptec-elibrary
    restart: unless-stopped
    env_file: .env
    # LAN-only binding: reachable on the ZimaOS box / local network for
    # debugging, but NOT via router port-forwarding (don't forward 3000!).
    # Once the tunnel is verified you can delete this ports block entirely —
    # cloudflared reaches the app over the internal network, not the host.
    ports:
      - "3000:3000"
    networks: [web]
    read_only: true
    tmpfs:
      # NOT /app/.next/server — that path holds the built server manifests
      # (pages-manifest.json et al) that COPY --from=builder puts in the image.
      # An empty tmpfs over it hides them and `node server.js` crash-loops with
      # ENOENT on pages-manifest.json. Only genuinely-written paths belong here.
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1g

  # Cloudflare Tunnel — outbound-only connection to Cloudflare's edge.
  # The tunnel and its public hostname are created in the Cloudflare account
  # that owns the ptec.edu.kh zone (the professor's — see docs/DNS-HANDOFF.md).
  # The box only ever needs the resulting connector token, in .env as
  # TUNNEL_TOKEN. The hostname must target http://app:3000 — the compose
  # service name, NOT localhost: cloudflared runs in its own container.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ptec-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    networks: [web]
    # service_started, not service_healthy: deploy/deploy.sh brings the app up
    # and waits for health itself, so it can roll back a bad image. Blocking
    # here would spend that timeout budget inside `compose up` instead.
    depends_on:
      - app
    security_opt:
      - no-new-privileges:true

networks:
  web:
    driver: bridge

x-casaos:
  architectures:
    # The published image is amd64 only — see the platforms comment in
    # .github/workflows/docker-publish.yml. Claiming arm64 here would advertise
    # an image tag that has no arm64 manifest.
    - amd64
  main: ptec-elibrary
  description:
    en_us: PTEC e-Library — free public digital library for Phnom Penh Teacher Education College
  title:
    en_us: PTEC e-Library
